<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة الأثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the real map of the game first, controls and the ready-made message under it, proof of accuracy last. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #17212b; --muted: #5a6876; --line: #c9d2db;
  --target: #1f5fbf;   --target-bg: #dce8fa;
  --removed: #c62828;  --removed-bg: #fbe1e1;
  --direct: #c2620a;   --direct-bg: #fde8cf;
  --indirect: #9a7b00; --indirect-bg: #fbf3cc;
  --safe: #2e7d4f;     --safe-bg: #e2f2e8;
  --font: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #17202a; --ink: #e8edf2; --muted: #93a1af; --line: #31404f;
    --target: #6ea3f2; --target-bg: #1b2f4d; --removed: #ff7b7b; --removed-bg: #4a2023;
    --direct: #f0a04b; --direct-bg: #45300f; --indirect: #e3c84f; --indirect-bg: #3b3510;
    --safe: #62c28a; --safe-bg: #17352a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --ink: #e8edf2; --muted: #93a1af; --line: #31404f;
  --target: #6ea3f2; --target-bg: #1b2f4d; --removed: #ff7b7b; --removed-bg: #4a2023;
  --direct: #f0a04b; --direct-bg: #45300f; --indirect: #e3c84f; --indirect-bg: #3b3510;
  --safe: #62c28a; --safe-bg: #17352a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.6; }
.app { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
header h1 { margin: 0 0 4px; font-size: 1.5rem; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 62ch; }
.cols { display: grid; gap: 16px; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
#map { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 4px 2px; padding: 0; font-size: .8125rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.dot { width: 14px; height: 14px; border-radius: 4px; border: 2px solid; display: inline-block; }
.dot.target { background: var(--target-bg); border-color: var(--target); }
.dot.removed { background: var(--removed-bg); border-color: var(--removed); }
.dot.direct { background: var(--direct-bg); border-color: var(--direct); }
.dot.indirect { background: var(--indirect-bg); border-color: var(--indirect); border-style: dashed; }
.dot.safe { background: var(--safe-bg); border-color: var(--safe); }

.node { cursor: pointer; outline: none; }
.node rect.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.node text { fill: var(--ink); font-family: var(--font); font-weight: 500; pointer-events: none; }
.node text.sub { font-size: 9.5px; font-weight: 600; opacity: .85; }
.node.area rect.box { stroke-width: 2; }
.node.area text.t { font-weight: 700; }
.node.core rect.box { fill: var(--ink); stroke: var(--ink); }
.node.core text { fill: var(--bg); font-weight: 700; }
.node.st-safe rect.box { fill: var(--safe-bg); stroke: var(--safe); }
.node.st-target rect.box { fill: var(--target-bg); stroke: var(--target); stroke-width: 2.5; }
.node.st-removed rect.box { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 2.5; }
.node.st-direct rect.box { fill: var(--direct-bg); stroke: var(--direct); stroke-width: 2; }
.node.st-indirect rect.box { fill: var(--indirect-bg); stroke: var(--indirect); stroke-width: 2; stroke-dasharray: 4 3; }
.node rect.ring { fill: none; stroke: var(--ink); stroke-width: 1.5; opacity: 0; }
.node.sel rect.ring { opacity: 1; }
.node:focus-visible rect.ring { opacity: 1; stroke: var(--target); stroke-width: 3; }
.badge circle { stroke: var(--surface); stroke-width: 1.5; }
.badge text { fill: #fff; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.b-removed circle { fill: var(--removed); } .b-direct circle { fill: var(--direct); }
.b-indirect circle { fill: var(--indirect); } .b-target circle { fill: var(--target); } .b-safe circle { fill: var(--safe); }
.tree-edge { fill: none; stroke: var(--line); stroke-width: 1.8; stroke-linecap: round; }
.flow-edge { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 4; }
#arrowhead path { fill: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .node rect.box { transition: fill .15s, stroke .15s; } }

.panel { display: grid; gap: 14px; }
.panel h2 { margin: 0; font-size: 1.25rem; }
.sel-desc { margin: 2px 0 0; color: var(--muted); }
.summary { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-weight: 600; line-height: 1.7; }
.unit span { display: block; }
details { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
details summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 10px; }
.where { margin: 4px 0 0; font-size: .8125rem; color: var(--muted); direction: ltr; text-align: right; unicode-bidi: plaintext; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: inherit; font-weight: 600; padding: 9px 12px; background: transparent; color: var(--ink); border: 0; cursor: pointer; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible, .copy:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--target); outline-offset: 2px; }
label { font-weight: 600; display: block; margin-bottom: 4px; }
textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 3px 10px; border-radius: 999px; font-size: .8125rem; font-weight: 600; border: 1.5px solid; }
.chip.removed { background: var(--removed-bg); border-color: var(--removed); color: var(--removed); }
.chip.target { background: var(--target-bg); border-color: var(--target); color: var(--target); }
.chip.direct { background: var(--direct-bg); border-color: var(--direct); color: var(--direct); }
.chip.indirect { background: var(--indirect-bg); border-color: var(--indirect); color: var(--indirect); border-style: dashed; }
.chip.safe { background: var(--safe-bg); border-color: var(--safe); color: var(--safe); }
.group h3 { margin: 0 0 4px; font-size: .9375rem; }
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.group li { padding: 8px 10px; border-radius: 10px; border-inline-start: 4px solid; background: var(--bg); }
.group li b { display: block; }
.group li .fn { font-weight: 500; }
.group li span { color: var(--muted); font-size: .875rem; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.g-removed li { border-color: var(--removed); } .g-direct li { border-color: var(--direct); } .g-indirect li { border-color: var(--indirect); }
.safe-line { margin: 0; color: var(--muted); font-size: .9375rem; }
.msg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.msg-head h3 { margin: 0; font-size: 1rem; }
.copy { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 10px; border: 0; background: var(--target); color: #fff; cursor: pointer; }
:root[data-theme="dark"] .copy { color: #0b1420; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .copy { color: #0b1420; } }
#msg { line-height: 1.75; min-height: 11rem; }
.note { margin: 0; color: var(--muted); font-size: .8125rem; }

[hidden] { display: none !important; }
.stack { display: grid; gap: 16px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.tabs button { font: inherit; font-weight: 600; padding: 11px 12px; background: transparent; color: var(--ink); border: 0; cursor: pointer; }
.tabs button + button { border-inline-start: 1px solid var(--line); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs button:focus-visible { outline: 3px solid var(--target); outline-offset: -3px; }
.appr { display: grid; gap: 14px; }
.appr h2 { margin: 0; font-size: 1.25rem; }
.appr .lead { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--bg); font-weight: 600; line-height: 1.8; border-inline-start: 5px solid var(--removed); }
.appr .demo { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--indirect-bg); border: 1px dashed var(--indirect); color: var(--ink); font-size: .875rem; }
.rule { padding: 10px 12px; border-radius: 10px; border-inline-start: 5px solid; background: var(--bg); display: grid; gap: 2px; }
.rule b { font-weight: 600; }
.rule .worst { font-size: .9375rem; }
.rule .meta { color: var(--muted); font-size: .8125rem; }
.rule code { direction: ltr; unicode-bidi: isolate; display: inline-block; font-size: .8125rem; color: var(--muted); }
.r-red { border-color: var(--removed); } .r-yellow { border-color: var(--direct); } .r-green { border-color: var(--safe); }
.appr h3 { margin: 6px 0 4px; font-size: .9375rem; }
.proof h2 { margin: 0 0 6px; font-size: 1.125rem; }
.proof p { margin: 0 0 8px; }
.proof ul { margin: 0 0 8px; padding-inline-start: 1.2rem; display: grid; gap: 4px; }
.big { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 12px; }
.big div { flex: 1 1 130px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--bg); }
.big strong { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.big span { color: var(--muted); font-size: .8125rem; }

/* permissions mode: same map, hacker look */
body.hack { --bg: #010603; --surface: #04110a; --ink: #c4ffd6; --muted: #5cc487; --line: #0e4a26;
  --target: #39ff14; --target-bg: #06260f; --removed: #ff4d5e; --removed-bg: #2a0a10; --direct: #ffb020; --direct-bg: #2b1d03;
  --indirect: #d7e34a; --indirect-bg: #242806; --safe: #39ff14; --safe-bg: #04230d;
  --font: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, Consolas, monospace; color-scheme: dark;
  background-image: linear-gradient(rgba(57,255,20,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(57,255,20,.05) 1px, transparent 1px); background-size: 28px 28px; }
body.hack::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px); }
body.hack h1, body.hack h2 { color: #39ff14; text-shadow: 0 0 10px rgba(57,255,20,.5); }
body.hack .card { box-shadow: 0 0 0 1px rgba(57,255,20,.08), 0 0 24px rgba(57,255,20,.07); }
body.hack .tabs button[aria-pressed="true"] { background: #39ff14; color: #02140a; }
body.hack .tree-edge { stroke: #1c7a3f; filter: drop-shadow(0 0 2px rgba(57,255,20,.6)); }
body.hack .node.core rect.box { fill: #06260f; stroke: #39ff14; filter: drop-shadow(0 0 6px rgba(57,255,20,.7)); }
body.hack .node.core text { fill: #39ff14; }
.node.pm-ok rect.box { fill: var(--safe-bg); stroke: var(--safe); filter: drop-shadow(0 0 3px rgba(57,255,20,.55)); }
.node.pm-watch rect.box { fill: var(--direct-bg); stroke: var(--direct); stroke-width: 2; filter: drop-shadow(0 0 4px rgba(255,176,32,.6)); }
.node.pm-danger rect.box { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(255,77,94,.75)); }
body.hack .node text.sub { font-size: 9px; letter-spacing: .02em; }
body.hack .appr, body.hack .rule { background: rgba(57,255,20,.04); }
.legend .tags { flex-basis: 100%; font-size: .75rem; }
.prompt { margin: 0; color: #39ff14; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: .875rem; direction: ltr; text-align: left; }
.prompt::after { content: "\25AE"; margin-inline-start: 4px; }
@media (prefers-reduced-motion: no-preference) { .prompt::after { animation: blink 1.1s steps(2, start) infinite; } @keyframes blink { to { visibility: hidden; } } }
.demo { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--indirect-bg); border: 1px dashed var(--indirect); font-size: .875rem; }
.lead { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--bg); font-weight: 600; line-height: 1.8; border-inline-start: 5px solid var(--removed); }
#permMap { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; }
.rowbtn { cursor: pointer; }
.rowbtn:hover { filter: brightness(1.2); }
.rowbtn:focus-visible { outline: 3px solid var(--target); outline-offset: 2px; }
.back { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--target); background: transparent; color: var(--target); cursor: pointer; justify-self: start; }
.back:focus-visible { outline: 3px solid var(--target); outline-offset: 2px; }
.chain { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: .9375rem; line-height: 1.8; }
.titlerow { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
#selName input { font: inherit; font-weight: 700; color: var(--ink); background: var(--bg); border: 1px solid var(--target); border-radius: 8px; padding: 4px 8px; width: 100%; min-width: 12ch; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1 id="projName">خريطة الأثر</h1>
    <p id="intro"></p>
    <p class="demo" id="limits" hidden></p>
  </header>

  <nav class="tabs" aria-label="العرض">
    <button type="button" id="tabMap" aria-pressed="true">خريطة المشروع</button>
    <button type="button" id="tabAppr" aria-pressed="false">الصلاحيات</button>
  </nav>

  <p class="prompt" id="hackPrompt" hidden>$ claude --permissions --reach</p>

  <div id="mapView" class="stack">
  <div class="cols">
    <section class="card" aria-label="خريطة اللعبة">
      <svg id="map" role="group" aria-label="خريطة أجزاء اللعبة">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z"></path></marker>
        </defs>
        <g id="treeLayer"></g><g id="flowLayer"></g><g id="nodeLayer"></g>
      </svg>
      <svg id="permMap" role="group" aria-label="خريطة الصلاحيات" hidden></svg>
      <ul class="legend" id="legendMap" aria-label="دليل الألوان">
        <li><span class="dot target"></span>ما ستعدّله</li>
        <li><span class="dot removed"></span>ما سيُحذف</li>
        <li><span class="dot direct"></span>يتأثر مباشرة</li>
        <li><span class="dot indirect"></span>قد يتأثر</li>
        <li><span class="dot safe"></span>سليم</li>
      </ul>
      <ul class="legend" id="legendHack" aria-label="دليل خريطة الصلاحيات" hidden>
        <li><span class="dot removed"></span>خطر</li>
        <li><span class="dot direct"></span>انتباه</li>
        <li><span class="dot safe"></span>آمن</li>
        <li class="tags">المركز ← الصلاحيات اللي سمحت فيها ← اضغط صلاحية لتشوف شو تفرّع منها ← الأجزاء اللي بتتأثر.</li>
      </ul>
    </section>

    <section class="card panel" id="panel" aria-live="polite">
      <div>
        <div class="titlerow"><h2 id="selName"></h2><button type="button" class="back" id="renameBtn">غيّر الاسم</button></div>
        <p class="sel-desc" id="selDesc"></p>
        <p class="where" id="selWhere"></p>
      </div>
      <div class="seg" role="group" aria-label="نوع التغيير">
        <button type="button" id="mModify" aria-pressed="true">تعديل</button>
        <button type="button" id="mDelete" aria-pressed="false">حذف</button>
      </div>
      <p class="summary" id="summary"></p>
      <div class="chips" id="chips"></div>
      <div id="groups" style="display:grid;gap:12px"></div>
    </section>
    <section class="card panel" id="permPanel" aria-live="polite" hidden></section>
  </div>

  <section class="card proof" id="proof" aria-label="مدى دقة الخريطة"></section>
  </div>

</main>

      x.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openRule(r); } });
    }
    if (!APPR) { add("h2", "", "صلاحيات Claude"); add("p", "safe-line", "ما في موافقات محمّلة بعد."); return; }
    if (PV.view === "rule") {
      var r = PV.rule, caps = capsOfRule(r);
      var back = add("button", "back", "← كل الصلاحيات"); back.type = "button"; back.addEventListener("click", function () { PV = { view: "top", rule: null, sel: null }; drawPerm(); renderPermPanel(); });
      add("h2", "", shortOf(r));
      add("p", "sel-desc", r.plain);
      add("p", "lead", (r.kind === "deny" ? "" : "أسوأ شي بيغطيه: ") + r.worst);
      add("p", "meta", (r.scopeText || "") + " · " + r.raw);
      add("h3", "", "شو تفرّع عنها");
      if (!caps.length) add("p", "safe-line", r.kind === "deny" ? "هاي حماية: Claude ما بيقدر يعمل هالشي." : "ما فيها قدرة خطرة.");
      caps.forEach(function (cap) {
        var ks = affectedKids(cap), txt = ks.map(function (k) { return k.label + (k.sub && k.kind !== "unit" && k.kind !== "umore" ? " (" + k.sub + ")" : ""); }).join("، ");
        add("p", "chain", "[" + CAPLBL[cap] + "] ← " + txt);
      });
      if (PV.sel && PV._node) {
        var n = PV._node;
        add("h3", "", n.label);
        if (n.kind === "cap") add("p", "safe-line", CAPEXPL[n.cap] || "");
        else if (n.kind === "unit") { var c = unitCaps(n.unit), ks2 = Object.keys(c); add("p", "safe-line", unitName(n.unit) + ": " + n.unit.desc); add("p", "safe-line", "قدراته: " + ks2.join(" ") + " (مكشوفة لهالصلاحية)."); }
        else if (n.kind === "umore") add("p", "safe-line", n.units.map(unitName).join("، "));
        else if (n.kind === "all") add("p", "safe-line", "الصلاحية بتغطي كل ملفات المشروع، فكل أجزاءه معرّضة.");
        else add("p", "safe-line", n.label);
      }
      return;
    }
    add("h2", "", "صلاحيات Claude" + (APPR.label ? " · " + APPR.label : ""));
    if (APPR.demo) add("p", "demo", "موافقات تجريبية للمثال، مو موافقاتك الحقيقية.");
    if (APPR.note) add("p", "demo", APPR.note);
    add("p", "lead", APPR.summary.sentence);
    var selN = PV._node && PV.sel ? PV._node : null;
    if (selN && (selN.kind === "cat" || selN.kind === "more")) {
      add("h3", "", selN.kind === "cat" ? selN.label + " (" + selN.rules.length + ")" : selN.label);
      add("p", "safe-line", "اضغط على صلاحية لتشوف شو تفرّع منها.");
      (selN.kind === "cat" ? selN.rules : selN.rules).forEach(function (r) { ruleRow(r, p); });
    } else {
      add("h3", "", "الأخطر، اضغط وحدة لتشوف شو تفرّع منها");
      allRules().filter(function (r) { return r.kind === "allow"; }).sort(function (a, b) { return RISKS[b.risk] - RISKS[a.risk]; }).slice(0, 5).forEach(function (r) { ruleRow(r, p); });
    }
    var det = add("details", "", null); add("summary", "", "كل الصلاحيات (" + allRules().length + ")", det);
    allRules().forEach(function (r) { if (!r.isMode) { var w = add("div", "", null, det); w.style.marginTop = "6px"; ruleRow(r, w); } });
  }
  function showTab(which) {
    HACK = which === "perm";
    document.body.classList.toggle("hack", HACK);
    $("tabMap").setAttribute("aria-pressed", String(!HACK)); $("tabAppr").setAttribute("aria-pressed", String(HACK));
    function setHidden(e, v) { if (v) e.setAttribute("hidden", ""); else e.removeAttribute("hidden"); }
    setHidden($("map"), HACK); setHidden($("permMap"), !HACK);
    $("panel").hidden = HACK; $("permPanel").hidden = !HACK; $("proof").hidden = HACK;
    $("legendMap").hidden = HACK; $("legendHack").hidden = !HACK; $("hackPrompt").hidden = !HACK;
    $("intro").textContent = HACK ? "خريطة الصلاحيات: بالنص Claude، حواليه الصلاحيات اللي سمحت فيها، واضغط على أي صلاحية لتشوف شو تفرّع منها وأي أجزاء بمشروعك بتتأثر." : MAP_INTRO;
    if (HACK) { PV = { view: "top", rule: null, sel: null }; drawPerm(); renderPermPanel(); } else { render(); fit(); }
  }
  $("tabMap").addEventListener("click", function () { showTab("map"); });
  $("tabAppr").addEventListener("click", function () { showTab("perm"); });

  $("renameBtn").addEventListener("click", function () {
    var d = DISP[state.sel], h = $("selName"), inp = document.createElement("input"), finished = false;
    inp.type = "text"; inp.value = d.name; inp.maxLength = 40; inp.setAttribute("aria-label", "الاسم الجديد");
    h.textContent = ""; h.appendChild(inp); inp.focus(); inp.select();
    function done(save) {
      if (finished) return; finished = true;
      if (save && inp.value.trim()) { d.name = inp.value.trim(); NM[d.id] = d.name; saveNames(NM); nodeEls[d.id].t.textContent = d.name; fit(); }
      render();
    }
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") done(true); else if (e.key === "Escape") done(false); });
    inp.addEventListener("blur", function () { done(true); });
  });

  // ---- proof section ---------------------------------------------------------------------------------
  (function proof() {
    var s = $("proof"); if (!RES) { s.hidden = true; return; }
    var h = '<h2>كم هالخريطة دقيقة؟</h2>' + RES.html;
    s.innerHTML = h;
  })();

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
