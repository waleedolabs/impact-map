<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة الأثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Idea: the project is a small night sky. Parts are bodies you can turn around; pressing one lights up what it pulls along with it.
   The permissions view is the same sky seen through a terminal: green on black, signals travelling outward from Claude. */
:root {
  --bg: #060913; --glass: rgba(13, 20, 40, .80); --glass-2: rgba(255, 255, 255, .045);
  --line: rgba(160, 182, 255, .16); --ink: #e9eefc; --muted: #94a2c8; --accent: #7aa2ff;
  --target: #5ec8ff;  --target-bg: rgba(94, 200, 255, .13);
  --removed: #ff6272; --removed-bg: rgba(255, 98, 114, .13);
  --direct: #ffb347;  --direct-bg: rgba(255, 179, 71, .13);
  --indirect: #f1dc6a; --indirect-bg: rgba(241, 220, 106, .11);
  --safe: #6fd3a8;    --safe-bg: rgba(111, 211, 168, .10);
  --display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --font: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
body.hack {
  --bg: #010603; --glass: rgba(2, 16, 8, .84); --glass-2: rgba(57, 255, 20, .05);
  --line: rgba(57, 255, 20, .24); --ink: #c4ffd6; --muted: #62c98c; --accent: #39ff14;
  --target: #39ff14; --target-bg: rgba(57, 255, 20, .10);
  --removed: #ff4d5e; --removed-bg: rgba(255, 77, 94, .12);
  --direct: #ffb020; --direct-bg: rgba(255, 176, 32, .12);
  --indirect: #d7e34a; --indirect-bg: rgba(215, 227, 74, .10);
  --safe: #39ff14; --safe-bg: rgba(57, 255, 20, .08);
  --display: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, Consolas, monospace;
  --font: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.65; min-height: 100vh;
  background-image: radial-gradient(1100px 600px at 70% -10%, rgba(80, 110, 255, .16), transparent 60%), radial-gradient(900px 500px at 0% 100%, rgba(120, 70, 255, .10), transparent 60%);
  background-attachment: fixed; transition: background-color .5s; }
body.hack { background-image: linear-gradient(rgba(57, 255, 20, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 20, .045) 1px, transparent 1px); background-size: 30px 30px; }
body.hack::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, .15) 2px 3px); }
.shell { max-width: 1500px; margin: 0 auto; padding: 14px clamp(12px, 2vw, 26px) 44px; display: grid; gap: 14px; }

/* ---- top bar ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 380px; }
.logo { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--accent); background: var(--glass-2); border: 1px solid var(--line); }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 2.4vw, 1.7rem); line-height: 1.25; text-wrap: balance; }
body.hack .brand h1 { color: #39ff14; text-shadow: 0 0 14px rgba(57, 255, 20, .55); }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; max-width: 70ch; }
.tabs { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--glass-2); border: 1px solid var(--line); }
.tabs button { font: inherit; font-weight: 600; font-size: .95rem; padding: 9px 20px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
body.hack .tabs button[aria-pressed="true"] { background: #39ff14; color: #02140a; box-shadow: 0 0 18px rgba(57, 255, 20, .45); }
.notice { margin: 0; padding: 8px 14px; border-radius: 12px; background: var(--indirect-bg); border: 1px dashed var(--indirect); font-size: .85rem; }

/* ---- workspace ---- */
.workspace { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .workspace { grid-template-columns: minmax(0, 1.75fr) minmax(340px, .95fr); align-items: start; } }
.left { display: grid; gap: 8px; min-width: 0; }
.stage { position: relative; height: clamp(430px, 70vh, 780px); border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: #050811; isolation: isolate; box-shadow: 0 30px 80px -40px rgba(60, 90, 255, .55); }
body.hack .stage { background: #000302; box-shadow: 0 0 0 1px rgba(57, 255, 20, .25), 0 0 60px -10px rgba(57, 255, 20, .35); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#cv.grabbing { cursor: grabbing; } #cv.hot { cursor: pointer; }
#cv:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 22px; }
.hud { position: absolute; z-index: 3; margin: 0; }
.hud-legend { inset-inline-start: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; list-style: none; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); font-size: .78rem; color: var(--muted); max-width: calc(100% - 28px); }
.hud-legend li { display: flex; align-items: center; gap: 7px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; background: currentColor; box-shadow: 0 0 10px currentColor; }
.dot.target { color: var(--target); } .dot.removed { color: var(--removed); } .dot.direct { color: var(--direct); } .dot.indirect { color: var(--indirect); } .dot.safe { color: var(--safe); }
.hud-tools { inset-inline-end: 14px; top: 14px; display: flex; gap: 6px; }
.hud-tools button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); color: var(--ink); cursor: pointer; display: grid; place-items: center; font: inherit; font-size: 1.1rem; }
.hud-tools button:hover { border-color: var(--accent); color: var(--accent); }
.hud-tools button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.hud-tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hud-hint { inset-inline-start: 50%; transform: translateX(50%); top: 16px; font-size: .78rem; color: var(--muted); background: var(--glass); border: 1px solid var(--line); padding: 5px 14px; border-radius: 999px; backdrop-filter: blur(10px); transition: opacity .8s; pointer-events: none; white-space: nowrap; }
[dir="rtl"] .hud-hint { transform: translateX(50%); }
.hud-hint.gone { opacity: 0; }
@media (max-width: 640px) { .hud-hint { display: none; } .prompt { top: 64px; right: 14px; font-size: .75rem; } }
.prompt { right: 16px; left: auto; top: 18px; margin: 0; color: #39ff14; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: .85rem; direction: ltr; text-align: left; text-shadow: 0 0 10px rgba(57, 255, 20, .6); }
.prompt::after { content: "\25AE"; margin-inline-start: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .prompt::after { animation: blink 1.1s steps(2, start) infinite; } @keyframes blink { to { visibility: hidden; } }
  .stage.boot::before { content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none; background: linear-gradient(180deg, transparent 0, rgba(57, 255, 20, .55) 50%, transparent 100%); height: 38%; animation: sweep .85s ease-in forwards; }
  @keyframes sweep { from { transform: translateY(-100%); opacity: 1; } to { transform: translateY(300%); opacity: 0; } }
}
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
.pick { flex: none; font: inherit; font-size: .85rem; font-weight: 500; color: var(--ink); background: var(--glass-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.pick:hover { border-color: var(--accent); }
.pick[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--safe)); box-shadow: 0 0 8px var(--c, var(--safe)); }
.pick.leaf { font-size: .8rem; color: var(--muted); }
.pick.leaf[aria-pressed="true"] { color: var(--bg); }

/* ---- side panel ---- */
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; backdrop-filter: blur(14px); }
@media (min-width: 1000px) { .panel { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; scrollbar-width: thin; } }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.3rem; line-height: 1.3; }
body.hack .panel h2 { color: #39ff14; text-shadow: 0 0 10px rgba(57, 255, 20, .45); }
.panel h3 { margin: 0 0 6px; font-size: .95rem; font-weight: 600; }
.titlerow { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.titlerow h2 { flex: 1; min-width: 0; }
.sel-desc { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
.where { margin: 4px 0 0; font-size: .78rem; color: var(--muted); direction: ltr; text-align: right; unicode-bidi: plaintext; opacity: .85; }
.back { font: inherit; font-weight: 500; font-size: .82rem; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-2); color: var(--ink); cursor: pointer; justify-self: start; white-space: nowrap; }
.back:hover { border-color: var(--accent); color: var(--accent); }
.back:focus-visible, .seg button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--glass-2); border: 1px solid var(--line); }
.seg button { font: inherit; font-weight: 600; padding: 9px 12px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--target); color: #04101c; }
.seg button#mDelete[aria-pressed="true"] { background: var(--removed); color: #1c0408; }
.summary { margin: 0; padding: 13px 15px; border-radius: 14px; background: var(--glass-2); border-inline-start: 4px solid var(--accent); font-size: 1rem; line-height: 1.85; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 3px 11px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid; }
.chip.removed { background: var(--removed-bg); border-color: var(--removed); color: var(--removed); }
.chip.target { background: var(--target-bg); border-color: var(--target); color: var(--target); }
.chip.direct { background: var(--direct-bg); border-color: var(--direct); color: var(--direct); }
.chip.indirect { background: var(--indirect-bg); border-color: var(--indirect); color: var(--indirect); border-style: dashed; }
.chip.safe { background: var(--safe-bg); border-color: var(--safe); color: var(--safe); }
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.group li { padding: 9px 12px; border-radius: 12px; border-inline-start: 3px solid var(--muted); background: var(--glass-2); }
.group li b { display: block; font-weight: 600; }
.group li .fn { font-weight: 500; }
.group li span { color: var(--muted); font-size: .85rem; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.g-removed li { border-color: var(--removed); } .g-direct li { border-color: var(--direct); } .g-indirect li { border-color: var(--indirect); }
.g-removed h3 { color: var(--removed); } .g-direct h3 { color: var(--direct); } .g-indirect h3 { color: var(--indirect); }
.safe-line { margin: 0; color: var(--muted); font-size: .9rem; }
details { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--glass-2); }
details summary { cursor: pointer; font-weight: 600; font-size: .92rem; }
details[open] summary { margin-bottom: 10px; }

/* permissions */
.lead { margin: 0; padding: 13px 15px; border-radius: 14px; background: var(--glass-2); font-weight: 500; line-height: 1.85; border-inline-start: 4px solid var(--removed); }
.demo { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--indirect-bg); border: 1px dashed var(--indirect); font-size: .85rem; }
.rule { padding: 10px 12px; border-radius: 12px; border-inline-start: 3px solid; background: var(--glass-2); display: grid; gap: 2px; margin-bottom: 7px; }
.rule b { font-weight: 600; } .rule .worst { font-size: .9rem; } .rule .meta { color: var(--muted); font-size: .78rem; }
.rule code { direction: ltr; unicode-bidi: isolate; display: inline-block; font-size: .78rem; color: var(--muted); }
.r-red { border-color: var(--removed); } .r-yellow { border-color: var(--direct); } .r-green { border-color: var(--safe); }
.rowbtn { cursor: pointer; transition: background .15s; } .rowbtn:hover { background: rgba(255, 255, 255, .08); }
.rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chain { margin: 0; padding: 9px 12px; border-radius: 12px; background: var(--glass-2); font-size: .9rem; line-height: 1.8; }

/* proof */
.proof { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
.proof h2 { margin: 0 0 8px; font-family: var(--display); font-size: 1.15rem; }
.proof p { margin: 0 0 8px; color: var(--muted); } .proof ul { margin: 0 0 8px; padding-inline-start: 1.2rem; display: grid; gap: 4px; }
.big { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 12px; }
.big div { flex: 1 1 140px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--glass-2); }
.big strong { display: block; font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.big span { color: var(--muted); font-size: .82rem; }
#selName input { font: inherit; font-weight: 600; color: var(--ink); background: var(--glass-2); border: 1px solid var(--accent); border-radius: 8px; padding: 4px 8px; width: 100%; min-width: 12ch; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="13" cy="13" r="3.2" fill="currentColor"/><circle cx="4.5" cy="7" r="2"/><circle cx="21.5" cy="6" r="2"/><circle cx="20" cy="21" r="2"/><circle cx="6" cy="20" r="2"/><path d="M11 11.2 6 8M15 11.5l5-4M15 15l4 4.4M11 15l-3.6 3.6"/></svg></span>
      <div><h1 id="projName">خريطة الأثر</h1><p id="intro"></p></div>
    </div>
    <nav class="tabs" aria-label="العرض">
      <button type="button" id="tabMap" aria-pressed="true">خريطة المشروع</button>
      <button type="button" id="tabAppr" aria-pressed="false">الصلاحيات</button>
    </nav>
  </header>
  <p class="notice" id="limits" hidden></p>

  <main class="workspace">
    <div class="left">
      <section class="stage" id="stage" aria-label="الخريطة ثلاثية الأبعاد">
        <canvas id="cv" tabindex="0" role="application" aria-label="خريطة ثلاثية الأبعاد. الأسهم تدوّر، زائد وناقص للتقريب. للتنقل بين الأجزاء استخدم القائمة تحت الخريطة."></canvas>
        <p class="hud hud-hint" id="hint">اسحب للتدوير · عجلة الماوس للتقريب · اضغط على أي جزء</p>
        <div class="hud hud-tools" role="group" aria-label="أدوات العرض">
          <button type="button" id="bSpin" aria-pressed="true" title="دوران تلقائي" aria-label="دوران تلقائي">&#10227;</button>
          <button type="button" id="bIn" title="تقريب" aria-label="تقريب">+</button>
          <button type="button" id="bOut" title="تبعيد" aria-label="تبعيد">&minus;</button>
          <button type="button" id="bReset" title="إعادة الزاوية" aria-label="إعادة الزاوية">&#9678;</button>
        </div>
        <ul class="hud hud-legend" id="legendMap" aria-label="دليل الألوان">
          <li><span class="dot target"></span>ما ستعدّله</li>
          <li><span class="dot removed"></span>ما سيُحذف</li>
          <li><span class="dot direct"></span>يتأثر مباشرة</li>
          <li><span class="dot indirect"></span>قد يتأثر</li>
          <li><span class="dot safe"></span>سليم</li>
        </ul>
        <ul class="hud hud-legend" id="legendHack" aria-label="دليل خريطة الصلاحيات" hidden>
          <li><span class="dot removed"></span>خطر</li>
          <li><span class="dot direct"></span>انتباه</li>
          <li><span class="dot safe"></span>آمن</li>
        </ul>
        <p class="hud prompt" id="hackPrompt" hidden></p>
      </section>
      <div class="strip" id="strip" role="group" aria-label="أجزاء المشروع"></div>
    </div>

    <section class="panel" id="panel" aria-live="polite">
      <div>
        <div class="titlerow"><h2 id="selName"></h2><button type="button" class="back" id="renameBtn">غيّر الاسم</button></div>
        <p class="sel-desc" id="selDesc"></p>
        <p class="where" id="selWhere"></p>
      </div>
      <div class="seg" role="group" aria-label="نوع التغيير">
        <button type="button" id="mModify" aria-pressed="true">تعديل</button>
        <button type="button" id="mDelete" aria-pressed="false">حذف</button>
      </div>
      <p class="summary" id="summary"></p>
      <div class="chips" id="chips"></div>
      <div id="groups" style="display:grid;gap:14px"></div>
    </section>
    <section class="panel" id="permPanel" aria-live="polite" hidden></section>
  </main>

  <section class="proof" id="proof" aria-label="مدى دقة الخريطة"></section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var G = /*GRAPH*/null;
  var RES = /*RESULTS*/null;
  var AREAS = /*AREAS*/null;
  var APPR = /*APPROVALS*/null;
  var PROJECT = /*PROJECT*/null;
  var LSKEY = "impact:" + PROJECT.name + ":names";
  function loadNames() { try { return JSON.parse(localStorage.getItem(LSKEY) || "{}") || {}; } catch (e) { return {}; } }
  function saveNames(n) { try { localStorage.setItem(LSKEY, JSON.stringify(n)); } catch (e) {} }
  var NM = loadNames();
  document.title = "خريطة الأثر · " + PROJECT.name;
  $("projName").textContent = "خريطة " + PROJECT.name;
  var MAP_INTRO = PROJECT.stats.files + " ملف و" + PROJECT.stats.functions + " دالة، مرسومة من الكود نفسه. دوّر الخريطة، اضغط أي جزء، واختر «تعديل» أو «حذف» لتشوف شو رح يتأثر قبل ما تلمس شي.";
  $("intro").textContent = MAP_INTRO;
  if (PROJECT.warnings && PROJECT.warnings.length) { var lim = $("limits"); lim.hidden = false; lim.textContent = PROJECT.warnings.join(" · "); }

  // ---- graph lookups ----------------------------------------------------------------------------
  var NODE = {}, KIDS = {}, DEPS = {};
  G.nodes.forEach(function (n) { NODE[n.id] = n; if (n.parent) (KIDS[n.parent] = KIDS[n.parent] || []).push(n.id); });
  G.edges.forEach(function (e) { (DEPS[e.to] = DEPS[e.to] || []).push(e); });
  function descendants(id) { var out = []; (KIDS[id] || []).forEach(function (c) { out.push(c); out = out.concat(descendants(c)); }); return out; }
  function label(id) {
    var n = NODE[id];
    if (n.kind === "route") return "طلب " + n.name;
    if (n.kind === "top") return "الكود الرئيسي لملف " + n.file.split("/").pop();
    if (n.kind === "data") return "بيانات " + n.name;
    return n.name;
  }
  function where(id) { var n = NODE[id]; return n.kind === "route" || n.kind === "top" ? n.file : n.file + ":" + n.start; }
  var HOW = { calls: "يستدعي", passes: "يمرّر", uses: "يقرأ", network: "يرسل طلباً إلى" };

  // ---- display nodes (areas and leaves) ---------------------------------------------------------
  var DISP = {}, order = [];
  AREAS.forEach(function (a) {
    var an = { id: a.id, name: NM[a.id] || a.name, desc: a.desc, kind: "area", members: [], leaves: [] };
    DISP[a.id] = an; order.push(an);
    a.leaves.forEach(function (l) {
      var ln = { id: l.id, name: NM[l.id] || l.name, desc: l.desc || a.desc, kind: "leaf", members: l.members, area: a.id };
      DISP[l.id] = ln; an.leaves.push(ln); order.push(ln);
    });
    if (!a.leaves.length) an.members = a.members; else an.members = [].concat.apply([], a.leaves.map(function (l) { return l.members; }));
  });
  var HOME = {};

    caps.forEach(function (cap) { groups.push({ node: { id: "cap:" + cap, kind: "cap", cap: cap, r: 15, label: CAPLBL[cap], sub: "", state: CAPSTATE[cap] }, kids: affectedKids(cap) }); });
    if (!groups.length) groups.push({ node: { id: "cap:none", kind: "cap", cap: "none", r: 15, label: r.kind === "deny" ? "محمي" : "ما فيه أثر خطر", sub: "", state: "ok" }, kids: [] });
    return { center: { id: "c", kind: "center", r: 25, label: shortOf(r), sub: r.kind === "deny" ? "ممنوع" : "صلاحية دائمة", state: r.kind === "deny" ? "ok" : stOf(r.risk) }, groups: groups };
  }
  function drawPerm(keepView) {
    var tree = PV.view === "rule" ? ruleTree(PV.rule) : topTree(), L = layout3d(tree);
    L.N.forEach(function (n) { n.sel = PV.sel === n.id; });
    Stage.setScene({ nodes: L.N, edges: L.E, flows: [], byId: L.byId }, "hack", keepView);
    if (PV.sel) Stage.focusOn(PV.sel);
  }
  function onPermNode(n) {
    var viewChanged = false;
    if (n.kind === "rule") { PV = { view: "rule", rule: n.rule, sel: null }; viewChanged = true; }
    else if (n.kind === "center" && PV.view === "rule") { PV = { view: "top", rule: null, sel: null }; viewChanged = true; }
    else { PV.sel = n.id; PV._node = n; }
    drawPerm(!viewChanged); renderPermPanel();
    if (window.innerWidth < 1000) { var r = $("permPanel").getBoundingClientRect(); if (r.top > window.innerHeight * .8) { try { $("permPanel").scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {} } }
  }
  function openRule(r) { PV = { view: "rule", rule: r, sel: null }; drawPerm(false); renderPermPanel(); }
  function renderPermPanel() {
    var p = $("permPanel"); p.textContent = "";
    function add(tag, cls, text, parent) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; (parent || p).appendChild(e); return e; }
    function ruleRow(r, parent) {
      var x = add("div", "rule rowbtn r-" + (r.kind === "deny" ? "green" : r.risk), null, parent); x.setAttribute("role", "button"); x.tabIndex = 0;
      add("b", "", r.plain, x); add("span", "worst", (r.kind === "deny" ? "" : "أسوأ شي بيغطيه: ") + r.worst, x);
      var m = add("span", "meta", (r.scopeText || "") + " · ", x); add("code", "", r.raw, m);
      x.addEventListener("click", function () { openRule(r); });
      x.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openRule(r); } });
    }
    if (!APPR) { add("h2", "", "صلاحيات Claude"); add("p", "safe-line", "ما في موافقات محمّلة بعد."); return; }
    if (PV.view === "rule") {
      var r = PV.rule, caps = capsOfRule(r);
      var back = add("button", "back", "← كل الصلاحيات"); back.type = "button"; back.addEventListener("click", function () { PV = { view: "top", rule: null, sel: null }; drawPerm(false); renderPermPanel(); });
      add("h2", "", shortOf(r));
      add("p", "sel-desc", r.plain);
      add("p", "lead", (r.kind === "deny" ? "" : "أسوأ شي بيغطيه: ") + r.worst);
      add("p", "safe-line", (r.scopeText || "") + " · " + r.raw);
      add("h3", "", "شو تفرّع عنها");
      if (!caps.length) add("p", "safe-line", r.kind === "deny" ? "هاي حماية: Claude ما بيقدر يعمل هالشي." : "ما فيها قدرة خطرة.");
      caps.forEach(function (cap) {
        var ks = affectedKids(cap), txt = ks.map(function (k) { return k.label + (k.sub && k.kind !== "unit" && k.kind !== "umore" ? " (" + k.sub + ")" : ""); }).join("، ");
        add("p", "chain", "[" + CAPLBL[cap] + "] ← " + txt);
      });
      if (PV.sel && PV._node) {
        var n = PV._node;
        add("h3", "", n.label);
        if (n.kind === "cap") add("p", "safe-line", CAPEXPL[n.cap] || "");
        else if (n.kind === "unit") { var c = unitCaps(n.unit), ks2 = Object.keys(c); add("p", "safe-line", unitName(n.unit) + ": " + n.unit.desc); add("p", "safe-line", "قدراته: " + ks2.join(" ") + " (مكشوفة لهالصلاحية)."); }
        else if (n.kind === "umore") add("p", "safe-line", n.units.map(unitName).join("، "));
        else if (n.kind === "all") add("p", "safe-line", "الصلاحية بتغطي كل ملفات المشروع، فكل أجزاءه معرّضة.");
        else add("p", "safe-line", n.label);
      }
      return;
    }
    add("h2", "", "صلاحيات Claude" + (APPR.label ? " · " + APPR.label : ""));
    if (APPR.demo) add("p", "demo", "موافقات تجريبية للمثال، مو موافقاتك الحقيقية.");
    if (APPR.note) add("p", "demo", APPR.note);
    add("p", "lead", APPR.summary.sentence);
    var selN = PV._node && PV.sel ? PV._node : null;
    if (selN && (selN.kind === "cat" || selN.kind === "more")) {
      add("h3", "", selN.kind === "cat" ? selN.label + " (" + selN.rules.length + ")" : selN.label);
      add("p", "safe-line", "اضغط على صلاحية لتشوف شو تفرّع منها.");
      selN.rules.forEach(function (r) { ruleRow(r, p); });
    } else {
      add("h3", "", "الأخطر، اضغط وحدة لتشوف شو تفرّع منها");
      allRules().filter(function (r) { return r.kind === "allow"; }).sort(function (a, b) { return RISKS[b.risk] - RISKS[a.risk]; }).slice(0, 5).forEach(function (r) { ruleRow(r, p); });
    }
    var det = add("details", "", null); add("summary", "", "كل الصلاحيات (" + allRules().length + ")", det);
    allRules().forEach(function (r) { if (!r.isMode) { var w = add("div", "", null, det); w.style.marginTop = "6px"; ruleRow(r, w); } });
  }

  var typer = null;
  function typePrompt(text) {
    var el = $("hackPrompt"); clearInterval(typer); el.textContent = "";
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = text; return; }
    var i = 0; typer = setInterval(function () { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typer); }, 28);
  }
  function showTab(which) {
    HACK = which === "perm";
    document.body.classList.toggle("hack", HACK);
    $("tabMap").setAttribute("aria-pressed", String(!HACK)); $("tabAppr").setAttribute("aria-pressed", String(HACK));
    $("panel").hidden = HACK; $("permPanel").hidden = !HACK; $("proof").hidden = HACK || !RES; $("strip").hidden = HACK;
    $("legendMap").hidden = HACK; $("legendHack").hidden = !HACK; $("hackPrompt").hidden = !HACK;
    $("intro").textContent = HACK ? "هون كل شي سمحت لClaude فيه. المركز هو Claude، وحواليه الصلاحيات، واضغط أي وحدة لتشوف شو تفرّع منها وأي أجزاء من مشروعك بتوصلها." : MAP_INTRO;
    var st = $("stage"); st.classList.remove("boot"); void st.offsetWidth; if (HACK) st.classList.add("boot");
    if (HACK) { PV = { view: "top", rule: null, sel: null }; drawPerm(false); renderPermPanel(); typePrompt("$ claude --permissions --reach"); }
    else { Stage.setScene(mapScene, "map", false); render(); }
  }
  $("tabMap").addEventListener("click", function () { if (HACK) showTab("map"); });
  $("tabAppr").addEventListener("click", function () { if (!HACK) showTab("perm"); });
  Stage.onPick = function (n) { if (HACK) onPermNode(n); else choose(n.id, true); };

  $("renameBtn").addEventListener("click", function () {
    var d = DISP[state.sel], h = $("selName"), inp = document.createElement("input"), finished = false;
    inp.type = "text"; inp.value = d.name; inp.maxLength = 40; inp.setAttribute("aria-label", "الاسم الجديد");
    h.textContent = ""; h.appendChild(inp); inp.focus(); inp.select();
    function done(save) {
      if (finished) return; finished = true;
      if (save && inp.value.trim()) { d.name = inp.value.trim(); NM[d.id] = d.name; saveNames(NM); pickBtns[d.id].s.textContent = d.name; }
      render();
    }
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") done(true); else if (e.key === "Escape") done(false); });
    inp.addEventListener("blur", function () { done(true); });
  });

  // ---- proof section ---------------------------------------------------------------------------------
  (function proof() { var s = $("proof"); if (!RES) { s.hidden = true; return; } s.innerHTML = '<h2>كم هالخريطة دقيقة؟</h2>' + RES.html; })();

  Stage.setScene(mapScene, "map", false);
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { Stage.mark(); });
})();
</script>
</body>
</html>
