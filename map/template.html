<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة الأثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Same map shapes as before (boxes on a tree). New: polished surfaces, light and dark, zoom and drag. */
:root {
  --bg: #eef1f6; --glass: rgba(255,255,255,.88); --glass-2: rgba(25,45,90,.045);
  --line: rgba(30,50,90,.16); --ink: #16202e; --muted: #58687e; --accent: #2d63d8;
  --target: #1f5fbf;  --target-bg: rgba(31,95,191,.12);
  --removed: #c62828; --removed-bg: rgba(198,40,40,.11);
  --direct: #c2620a;  --direct-bg: rgba(194,98,10,.12);
  --indirect: #8f7300; --indirect-bg: rgba(154,123,0,.12);
  --safe: #2e7d4f;    --safe-bg: rgba(46,125,79,.11);
  --node: #ffffff; --node-line: #c3cddb; --edge: #a9b6c9; --shadow: rgba(30,50,90,.16);
  --stage: linear-gradient(180deg,#fbfcfe,#eef2f8); --dots: rgba(30,50,90,.13); --on: #ffffff;
  --page: radial-gradient(1000px 500px at 80% -10%, rgba(80,120,255,.10), transparent 60%);
  --display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --font: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b1020; --glass:rgba(16,24,46,.82); --glass-2:rgba(255,255,255,.05); --line:rgba(160,182,255,.17); --ink:#e9eefc; --muted:#94a2c8; --accent:#7aa2ff;
 --target:#5ec8ff; --target-bg:rgba(94,200,255,.14); --removed:#ff6272; --removed-bg:rgba(255,98,114,.14); --direct:#ffb347; --direct-bg:rgba(255,179,71,.14);
 --indirect:#f1dc6a; --indirect-bg:rgba(241,220,106,.12); --safe:#6fd3a8; --safe-bg:rgba(111,211,168,.11);
 --node:#141d38; --node-line:rgba(160,182,255,.30); --edge:rgba(150,172,255,.38); --shadow:rgba(0,0,0,.55);
 --stage:radial-gradient(900px 520px at 50% 40%,#111b3a,#060913); --dots:rgba(160,182,255,.10); --on:#04101c;
 --page:radial-gradient(1100px 600px at 70% -10%,rgba(80,110,255,.16),transparent 60%),radial-gradient(900px 500px at 0% 100%,rgba(120,70,255,.10),transparent 60%); color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#0b1020; --glass:rgba(16,24,46,.82); --glass-2:rgba(255,255,255,.05); --line:rgba(160,182,255,.17); --ink:#e9eefc; --muted:#94a2c8; --accent:#7aa2ff;
 --target:#5ec8ff; --target-bg:rgba(94,200,255,.14); --removed:#ff6272; --removed-bg:rgba(255,98,114,.14); --direct:#ffb347; --direct-bg:rgba(255,179,71,.14);
 --indirect:#f1dc6a; --indirect-bg:rgba(241,220,106,.12); --safe:#6fd3a8; --safe-bg:rgba(111,211,168,.11);
 --node:#141d38; --node-line:rgba(160,182,255,.30); --edge:rgba(150,172,255,.38); --shadow:rgba(0,0,0,.55);
 --stage:radial-gradient(900px 520px at 50% 40%,#111b3a,#060913); --dots:rgba(160,182,255,.10); --on:#04101c;
 --page:radial-gradient(1100px 600px at 70% -10%,rgba(80,110,255,.16),transparent 60%),radial-gradient(900px 500px at 0% 100%,rgba(120,70,255,.10),transparent 60%); color-scheme:dark; }
body.hack {
  --bg: #010603; --glass: rgba(2,16,8,.86); --glass-2: rgba(57,255,20,.05);
  --line: rgba(57,255,20,.26); --ink: #c4ffd6; --muted: #62c98c; --accent: #39ff14;
  --target: #39ff14; --target-bg: rgba(57,255,20,.10);
  --removed: #ff4d5e; --removed-bg: rgba(255,77,94,.12);
  --direct: #ffb020; --direct-bg: rgba(255,176,32,.12);
  --indirect: #d7e34a; --indirect-bg: rgba(215,227,74,.10);
  --safe: #39ff14; --safe-bg: rgba(57,255,20,.08);
  --node: #04110a; --node-line: #0f5a2c; --edge: #1c7a3f; --shadow: rgba(57,255,20,.35);
  --stage: #000302; --dots: rgba(57,255,20,.10); --on: #02140a; --page: none;
  --display: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, Consolas, monospace;
  --font: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, Consolas, monospace; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg) var(--page); background-attachment: fixed; color: var(--ink); font-family: var(--font); line-height: 1.65; min-height: 100vh; }
body.hack { background-image: linear-gradient(rgba(57, 255, 20, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 20, .045) 1px, transparent 1px); background-size: 30px 30px; }
body.hack::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, .15) 2px 3px); }
.shell { max-width: 1500px; margin: 0 auto; padding: 14px clamp(12px, 2vw, 26px) 44px; display: grid; gap: 14px; }

/* ---- top bar ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 380px; }
.logo { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--accent); background: var(--glass-2); border: 1px solid var(--line); }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 2.4vw, 1.7rem); line-height: 1.25; text-wrap: balance; }
body.hack .brand h1 { color: #39ff14; text-shadow: 0 0 14px rgba(57, 255, 20, .55); }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; max-width: 70ch; }
.tabs { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--glass-2); border: 1px solid var(--line); }
.tabs button { font: inherit; font-weight: 600; font-size: .95rem; padding: 9px 20px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
body.hack .tabs button[aria-pressed="true"] { background: #39ff14; color: #02140a; box-shadow: 0 0 18px rgba(57, 255, 20, .45); }
.notice { margin: 0; padding: 8px 14px; border-radius: 12px; background: var(--indirect-bg); border: 1px dashed var(--indirect); font-size: .85rem; }

/* ---- workspace ---- */
.workspace { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .workspace { grid-template-columns: minmax(0, 1.75fr) minmax(340px, .95fr); align-items: start; } }
.left { display: grid; gap: 8px; min-width: 0; }
.stage { position: relative; height: clamp(440px, 72vh, 780px); border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); isolation: isolate; box-shadow: 0 24px 60px -36px var(--shadow); }
body.hack .stage { box-shadow: 0 0 0 1px rgba(57,255,20,.25), 0 0 60px -10px rgba(57,255,20,.35); }
.hud { position: absolute; z-index: 3; margin: 0; }
.hud-legend { inset-inline-start: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; list-style: none; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); font-size: .78rem; color: var(--muted); max-width: calc(100% - 28px); }
.hud-legend li { display: flex; align-items: center; gap: 7px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; background: currentColor; box-shadow: 0 0 10px currentColor; }
.dot.target { color: var(--target); } .dot.removed { color: var(--removed); } .dot.direct { color: var(--direct); } .dot.indirect { color: var(--indirect); } .dot.safe { color: var(--safe); }
.hud-tools { inset-inline-end: 14px; top: 14px; display: flex; gap: 6px; }
.hud-tools button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); color: var(--ink); cursor: pointer; display: grid; place-items: center; font: inherit; font-size: 1.1rem; }
.hud-tools button:hover { border-color: var(--accent); color: var(--accent); }
.hud-tools button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.hud-tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hud-hint { inset-inline-start: 50%; transform: translateX(50%); top: 16px; font-size: .78rem; color: var(--muted); background: var(--glass); border: 1px solid var(--line); padding: 5px 14px; border-radius: 999px; backdrop-filter: blur(10px); transition: opacity .8s; pointer-events: none; white-space: nowrap; }
[dir="rtl"] .hud-hint { transform: translateX(50%); }
.hud-hint.gone { opacity: 0; }
@media (max-width: 640px) { .hud-hint { display: none; } .prompt { top: 64px; right: 14px; font-size: .75rem; } }
.prompt { right: 16px; left: auto; top: 18px; margin: 0; color: #39ff14; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: .85rem; direction: ltr; text-align: left; text-shadow: 0 0 10px rgba(57, 255, 20, .6); }
.prompt::after { content: "\25AE"; margin-inline-start: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .prompt::after { animation: blink 1.1s steps(2, start) infinite; } @keyframes blink { to { visibility: hidden; } }
  .stage.boot::before { content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none; background: linear-gradient(180deg, transparent 0, rgba(57, 255, 20, .55) 50%, transparent 100%); height: 38%; animation: sweep .85s ease-in forwards; }
  @keyframes sweep { from { transform: translateY(-100%); opacity: 1; } to { transform: translateY(300%); opacity: 0; } }
}
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
.pick { flex: none; font: inherit; font-size: .85rem; font-weight: 500; color: var(--ink); background: var(--glass-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.pick:hover { border-color: var(--accent); }
.pick[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--safe)); box-shadow: 0 0 8px var(--c, var(--safe)); }
.pick.leaf { font-size: .8rem; color: var(--muted); }
.pick.leaf[aria-pressed="true"] { color: var(--bg); }

/* ---- side panel ---- */
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; backdrop-filter: blur(14px); }
@media (min-width: 1000px) { .panel { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; scrollbar-width: thin; } }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.3rem; line-height: 1.3; }
body.hack .panel h2 { color: #39ff14; text-shadow: 0 0 10px rgba(57, 255, 20, .45); }
.panel h3 { margin: 0 0 6px; font-size: .95rem; font-weight: 600; }
.titlerow { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.titlerow h2 { flex: 1; min-width: 0; }
.sel-desc { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
.where { margin: 4px 0 0; font-size: .78rem; color: var(--muted); direction: ltr; text-align: right; unicode-bidi: plaintext; opacity: .85; }
.back { font: inherit; font-weight: 500; font-size: .82rem; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-2); color: var(--ink); cursor: pointer; justify-self: start; white-space: nowrap; }
.back:hover { border-color: var(--accent); color: var(--accent); }
.back:focus-visible, .seg button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--glass-2); border: 1px solid var(--line); }
.seg button { font: inherit; font-weight: 600; padding: 9px 12px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--target); color: var(--on); }
.seg button#mDelete[aria-pressed="true"] { background: var(--removed); color: #fff; }
.summary { margin: 0; padding: 13px 15px; border-radius: 14px; background: var(--glass-2); border-inline-start: 4px solid var(--accent); font-size: 1rem; line-height: 1.85; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 3px 11px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid; }
.chip.removed { background: var(--removed-bg); border-color: var(--removed); color: var(--removed); }
.chip.target { background: var(--target-bg); border-color: var(--target); color: var(--target); }
.chip.direct { background: var(--direct-bg); border-color: var(--direct); color: var(--direct); }
.chip.indirect { background: var(--indirect-bg); border-color: var(--indirect); color: var(--indirect); border-style: dashed; }
.chip.safe { background: var(--safe-bg); border-color: var(--safe); color: var(--safe); }
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.group li { padding: 9px 12px; border-radius: 12px; border-inline-start: 3px solid var(--muted); background: var(--glass-2); }
.group li b { display: block; font-weight: 600; }
.group li .fn { font-weight: 500; }
.group li span { color: var(--muted); font-size: .85rem; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.g-removed li { border-color: var(--removed); } .g-direct li { border-color: var(--direct); } .g-indirect li { border-color: var(--indirect); }
.g-removed h3 { color: var(--removed); } .g-direct h3 { color: var(--direct); } .g-indirect h3 { color: var(--indirect); }
.safe-line { margin: 0; color: var(--muted); font-size: .9rem; }
details { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--glass-2); }
details summary { cursor: pointer; font-weight: 600; font-size: .92rem; }
details[open] summary { margin-bottom: 10px; }

/* permissions */
.lead { margin: 0; padding: 13px 15px; border-radius: 14px; background: var(--glass-2); font-weight: 500; line-height: 1.85; border-inline-start: 4px solid var(--removed); }
.demo { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--indirect-bg); border: 1px dashed var(--indirect); font-size: .85rem; }
.rule { padding: 10px 12px; border-radius: 12px; border-inline-start: 3px solid; background: var(--glass-2); display: grid; gap: 2px; margin-bottom: 7px; }
.rule b { font-weight: 600; } .rule .worst { font-size: .9rem; } .rule .meta { color: var(--muted); font-size: .78rem; }
.rule code { direction: ltr; unicode-bidi: isolate; display: inline-block; font-size: .78rem; color: var(--muted); }
.r-red { border-color: var(--removed); } .r-yellow { border-color: var(--direct); } .r-green { border-color: var(--safe); }
.rowbtn { cursor: pointer; transition: background .15s; } .rowbtn:hover { background: rgba(255, 255, 255, .08); }
.rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chain { margin: 0; padding: 9px 12px; border-radius: 12px; background: var(--glass-2); font-size: .9rem; line-height: 1.8; }

/* proof */
.proof { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
.proof h2 { margin: 0 0 8px; font-family: var(--display); font-size: 1.15rem; }
.proof p { margin: 0 0 8px; color: var(--muted); } .proof ul { margin: 0 0 8px; padding-inline-start: 1.2rem; display: grid; gap: 4px; }
.big { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 12px; }
.big div { flex: 1 1 140px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--glass-2); }
.big strong { display: block; font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.big span { color: var(--muted); font-size: .82rem; }
#selName input { font: inherit; font-weight: 600; color: var(--ink); background: var(--glass-2); border: 1px solid var(--accent); border-radius: 8px; padding: 4px 8px; width: 100%; min-width: 12ch; }

/* ---- the map itself (SVG, same shapes as the first version) ---- */
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.stage svg.grabbing { cursor: grabbing; }
.stage::before { content: ""; position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; }
.stage svg, .hud { z-index: 1; }
.node { cursor: pointer; outline: none; }
.node rect.box { fill: var(--node); stroke: var(--node-line); stroke-width: 1.4; filter: drop-shadow(0 3px 5px var(--shadow)); }
.node text { fill: var(--ink); font-family: var(--font); font-weight: 500; pointer-events: none; }
.node text.sub { font-size: 9.5px; font-weight: 600; opacity: .8; }
.node.area rect.box { stroke-width: 1.8; }
.node.area text.t { font-weight: 700; }
.node.core rect.box { fill: var(--ink); stroke: var(--ink); }
.node.core text { fill: var(--bg); font-weight: 700; }
body.hack .node.core rect.box { fill: #06260f; stroke: #39ff14; filter: drop-shadow(0 0 8px rgba(57,255,20,.7)); }
body.hack .node.core text { fill: #39ff14; }
.node.st-safe rect.box { fill: color-mix(in srgb, var(--safe) 13%, var(--node)); stroke: var(--safe); }
.node.st-target rect.box { fill: color-mix(in srgb, var(--target) 20%, var(--node)); stroke: var(--target); stroke-width: 2.6; filter: drop-shadow(0 0 7px var(--target)); }
.node.st-removed rect.box { fill: color-mix(in srgb, var(--removed) 20%, var(--node)); stroke: var(--removed); stroke-width: 2.6; filter: drop-shadow(0 0 7px var(--removed)); }
.node.st-direct rect.box { fill: color-mix(in srgb, var(--direct) 20%, var(--node)); stroke: var(--direct); stroke-width: 2.2; filter: drop-shadow(0 0 5px var(--direct)); }
.node.st-indirect rect.box { fill: color-mix(in srgb, var(--indirect) 18%, var(--node)); stroke: var(--indirect); stroke-width: 2; stroke-dasharray: 4 3; }
.node.pm-ok rect.box { fill: color-mix(in srgb, var(--safe) 13%, var(--node)); stroke: var(--safe); filter: drop-shadow(0 0 4px rgba(57,255,20,.55)); }
.node.pm-watch rect.box { fill: color-mix(in srgb, var(--direct) 16%, var(--node)); stroke: var(--direct); stroke-width: 2; filter: drop-shadow(0 0 5px rgba(255,176,32,.6)); }
.node.pm-danger rect.box { fill: color-mix(in srgb, var(--removed) 18%, var(--node)); stroke: var(--removed); stroke-width: 2.4; filter: drop-shadow(0 0 7px rgba(255,77,94,.75)); }
.node rect.ring { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; opacity: 0; }
.node.sel rect.ring { opacity: 1; }
.node:focus-visible rect.ring { opacity: 1; stroke-dasharray: none; stroke-width: 3; }
.node:hover rect.box { stroke-width: 2.4; }
.badge circle { stroke: var(--node); stroke-width: 1.5; }
.badge text { fill: #fff; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.b-removed circle { fill: var(--removed); } .b-direct circle { fill: var(--direct); } .b-indirect circle { fill: var(--indirect); } .b-target circle { fill: var(--target); } .b-safe circle { fill: var(--safe); }
.tree-edge { fill: none; stroke: var(--edge); stroke-width: 1.8; stroke-linecap: round; }
body.hack .tree-edge { filter: drop-shadow(0 0 2px rgba(57,255,20,.6)); }
.flow-edge { fill: none; stroke: var(--direct); stroke-width: 2; stroke-dasharray: 6 5; opacity: .9; }
body.hack .flow-edge { stroke: #39ff14; }
#arrowhead path { fill: var(--direct); }
@media (prefers-reduced-motion: no-preference) {
  .flow-edge { animation: dash 1s linear infinite; } @keyframes dash { to { stroke-dashoffset: -22; } }
  .node rect.box { transition: fill .2s, stroke .2s; }
}
.hud-tools .theme { font-size: 1rem; }
.hud-tools button.txt { width: auto; padding: 0 14px; font-size: .85rem; font-weight: 600; white-space: nowrap; }
.node.fn text { font-weight: 500; }
.node.fn rect.box { stroke-width: 1.2; filter: none; }
.node.fn.st-target rect.box, .node.fn.st-removed rect.box, .node.fn.st-direct rect.box { filter: none; stroke-width: 2.2; }
.node.fn .badge circle { stroke-width: 1; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="13" cy="13" r="3.2" fill="currentColor"/><circle cx="4.5" cy="7" r="2"/><circle cx="21.5" cy="6" r="2"/><circle cx="20" cy="21" r="2"/><circle cx="6" cy="20" r="2"/><path d="M11 11.2 6 8M15 11.5l5-4M15 15l4 4.4M11 15l-3.6 3.6"/></svg></span>
      <div><h1 id="projName">خريطة الأثر</h1><p id="intro"></p></div>
    </div>

    if (!APPR) { add("h2", "", "صلاحيات Claude"); add("p", "safe-line", "ما في موافقات محمّلة بعد."); return; }

        var ks = affectedKids(cap), txt = ks.map(function (k) { return k.label + (k.sub && k.kind !== "unit" && k.kind !== "umore" ? " (" + k.sub + ")" : ""); }).join("، ");

      allRules().filter(function (r) { return r.kind === "allow"; }).sort(function (a, b) { return RISKS[b.risk] - RISKS[a.risk]; }).slice(0, 5).forEach(function (r) { ruleRow(r, p); });
    }
    var det = add("details", "", null); add("summary", "", "كل الصلاحيات (" + allRules().length + ")", det);
    allRules().forEach(function (r) { if (!r.isMode) { var w = add("div", "", null, det); w.style.marginTop = "6px"; ruleRow(r, w); } });
  }
  var typer = null;

    $("panel").hidden = HACK; $("permPanel").hidden = !HACK; $("proof").hidden = HACK || !RES; $("strip").hidden = HACK;

  $("renameBtn").addEventListener("click", function () {

  // ---- zoom and drag (works on whichever map is showing) ---------------------------------------------
  function curSvg() { return HACK ? $("permMap") : $("map"); }
  function vb(svg) { return svg.getAttribute("viewBox").split(" ").map(Number); }
  function setVb(svg, a) { svg.setAttribute("viewBox", a.join(" ")); }
  function resetView() { [$("map"), $("permMap")].forEach(function (s) { if (s._vb0) setVb(s, s._vb0); }); }
  function zoomBy(svg, f, cx, cy) {
    var a = vb(svg), b0 = svg._vb0 || a, nw = a[2] / f, nh = a[3] / f;
    if (nw > b0[2] * 1.6 || nw < b0[2] / 5) return;
    var px = cx == null ? a[0] + a[2] / 2 : cx, py = cy == null ? a[1] + a[3] / 2 : cy;
    setVb(svg, [px - (px - a[0]) / f, py - (py - a[1]) / f, nw, nh]);
  }
  function toUser(svg, ev) { var r = svg.getBoundingClientRect(), a = vb(svg), s = Math.min(r.width / a[2], r.height / a[3]), ox = (r.width - a[2] * s) / 2, oy = (r.height - a[3] * s) / 2; return { x: a[0] + (ev.clientX - r.left - ox) / s, y: a[1] + (ev.clientY - r.top - oy) / s, s: s }; }
  [$("map"), $("permMap")].forEach(function (svg) {
    var drag = null, moved = false;
    svg.addEventListener("wheel", function (e) { e.preventDefault(); var u = toUser(svg, e); zoomBy(svg, Math.exp(-e.deltaY * .0015), u.x, u.y); $("hint").classList.add("gone"); }, { passive: false });
    svg.addEventListener("pointerdown", function (e) { if (e.button > 0) return; drag = { x: e.clientX, y: e.clientY, vb: vb(svg), s: toUser(svg, e).s }; moved = false; });
    window.addEventListener("pointermove", function (e) {
      if (!drag || drag.svg === false) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      if (!moved) { moved = true; svg.classList.add("grabbing"); $("hint").classList.add("gone"); }
      var a = drag.vb; setVb(svg, [a[0] - dx / drag.s, a[1] - dy / drag.s, a[2], a[3]]);
    });
    window.addEventListener("pointerup", function () { if (drag) { drag = null; svg.classList.remove("grabbing"); } });
    svg.addEventListener("click", function (e) { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  });
  function zoomTo(id) {
    var svg = $("map"), p = pos[id], b0 = svg._vb0; if (!p || !b0) return;
    var w = Math.max(520, b0[2] / 4), h = w * b0[3] / b0[2], a = vb(svg);
    if (a[2] <= w * 1.05) { setVb(svg, [a[0] + (p.x - (a[0] + a[2] / 2)), a[1] + (p.y - (a[1] + a[3] / 2)), a[2], a[3]]); return; }
    setVb(svg, [p.x - w / 2, p.y - h / 2, w, h]);
  }
  $("bFull").addEventListener("click", function () {
    FULL = !FULL; this.setAttribute("aria-pressed", String(FULL)); this.textContent = FULL ? "ملخّص" : "كل التفاصيل";
    if (!FULL && DISP[state.sel] && DISP[state.sel].kind === "fn") state.sel = DISP[state.sel].area;
    buildMap();
    if (HACK) { drawPerm(); renderPermPanel(); } else { render(); }
    resetView();
    $("hint").textContent = FULL ? "كل دالة صارت مربع · كبّر بالعجلة واسحب" : "اسحب لتحريك الخريطة · عجلة الماوس للتقريب · اضغط على أي جزء"; $("hint").classList.remove("gone");
  });
  $("bIn").addEventListener("click", function () { zoomBy(curSvg(), 1.3); });
  $("bOut").addEventListener("click", function () { zoomBy(curSvg(), 1 / 1.3); });
  $("bReset").addEventListener("click", resetView);
  (function theme() {
    var root = document.documentElement, KEY = "impact:theme";
    try { var t = localStorage.getItem(KEY); if (t === "light" || t === "dark") root.setAttribute("data-theme", t); } catch (e) {}
    $("bTheme").addEventListener("click", function () {
      var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      var next = dark ? "light" : "dark"; root.setAttribute("data-theme", next); try { localStorage.setItem(KEY, next); } catch (e) {}
    });
  })();

  (function proof() {
