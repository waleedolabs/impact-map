<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة الأثر</title>
<style>
/* Impact Map: one spacing scale (4/8/12/16/24), three radii by hierarchy (containers 16, controls and inner blocks 10, small marks 6), pills only for status chips. */
:root {
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --r-lg: 16px; --r-md: 10px; --r-sm: 6px; --pill: 999px; --h-ctl: 36px; --h-sm: 32px;
  --bg: #f2f4f8; --surface: #ffffff; --glass: rgba(255,255,255,.94); --glass-2: #f4f6fa;
  --line: #dde3ec; --line-2: #c9d2df; --ink: #16202e; --muted: #526175; --accent: #2457c5;
  --target: #1f5fbf;  --target-bg: #e8effa;
  --removed: #bb2424; --removed-bg: #fbeaea;
  --direct: #a94f07;  --direct-bg: #fbefe4;
  --indirect: #765e00; --indirect-bg: #f7f2dc;
  --safe: #276b45;    --safe-bg: #e7f3ec;
  --node: #ffffff; --node-line: #c3cddb; --edge: #b0bccd; --shadow: rgba(30,50,90,.14);
  --stage: #fafbfd; --dots: rgba(30,50,90,.11); --on: #ffffff; --page: none;
  --display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --font: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --glow: 0; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b1020; --surface:#111a33; --glass:rgba(17,26,51,.94); --glass-2:#16203d; --line:#24305a; --line-2:#33417a; --ink:#e9eefc; --muted:#a0add0; --accent:#7aa2ff;
 --target:#5ec8ff; --target-bg:#13304a; --removed:#ff6f7d; --removed-bg:#3a1a2a; --direct:#ffb347; --direct-bg:#382a1c; --indirect:#f1dc6a; --indirect-bg:#302d1c; --safe:#6fd3a8; --safe-bg:#15332f;
 --node:#141d38; --node-line:#3a4a80; --edge:#3f4f86; --shadow:rgba(0,0,0,.5); --stage:#0d1429; --dots:rgba(160,182,255,.09); --on:#06101c; color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#0b1020; --surface:#111a33; --glass:rgba(17,26,51,.94); --glass-2:#16203d; --line:#24305a; --line-2:#33417a; --ink:#e9eefc; --muted:#a0add0; --accent:#7aa2ff;
 --target:#5ec8ff; --target-bg:#13304a; --removed:#ff6f7d; --removed-bg:#3a1a2a; --direct:#ffb347; --direct-bg:#382a1c; --indirect:#f1dc6a; --indirect-bg:#302d1c; --safe:#6fd3a8; --safe-bg:#15332f;
 --node:#141d38; --node-line:#3a4a80; --edge:#3f4f86; --shadow:rgba(0,0,0,.5); --stage:#0d1429; --dots:rgba(160,182,255,.09); --on:#06101c; color-scheme:dark; }
body.hack {
  --r-lg: 10px; --r-md: 6px; --r-sm: 4px;
  --bg: #010603; --surface: #020d06; --glass: rgba(2,14,7,.94); --glass-2: #03140a;
  --line: #0f4a25; --line-2: #17703a; --ink: #c4ffd6; --muted: #6fd497; --accent: #39ff14;
  --target: #39ff14; --target-bg: #062a10;
  --removed: #ff5c6c; --removed-bg: #2a0a10;
  --direct: #ffb020; --direct-bg: #2a1d05;
  --indirect: #d7e34a; --indirect-bg: #1f220a;
  --safe: #39ff14; --safe-bg: #062a10;
  --node: #04110a; --node-line: #0f5a2c; --edge: #1c7a3f; --shadow: rgba(57,255,20,.35);
  --stage: #000302; --dots: rgba(57,255,20,.09); --on: #02140a; --page: none;
  --display: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, Consolas, monospace;
  --font: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, Consolas, monospace; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.65; min-height: 100vh; -webkit-font-smoothing: antialiased; }
body.hack { background-image: linear-gradient(rgba(57, 255, 20, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 20, .04) 1px, transparent 1px); background-size: 32px 32px; }
body.hack::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, .14) 2px 3px); }
.shell { max-width: 1480px; margin: 0 auto; padding: var(--s5) clamp(12px, 2.4vw, 32px) 48px; display: grid; gap: var(--s4); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; }

/* ---- top bar ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3) var(--s5); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; flex: 1 1 420px; }
.logo { flex: none; width: 44px; height: 44px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--accent); background: var(--surface); border: 1px solid var(--line); }
.brand > div { min-width: 0; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 2.2vw, 1.6rem); line-height: 1.3; text-wrap: balance; }
body.hack .brand h1 { color: #39ff14; text-shadow: 0 0 12px rgba(57, 255, 20, .45); }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.6; max-width: 72ch; text-wrap: pretty; }
.tabs { display: inline-grid; grid-template-columns: 1fr 1fr; gap: var(--s1); padding: var(--s1); border-radius: calc(var(--r-md) + 4px); background: var(--surface); border: 1px solid var(--line); }
.tabs button { height: var(--h-ctl); font-weight: 600; font-size: .92rem; padding: 0 var(--s5); border: 0; border-radius: var(--r-md); background: transparent; color: var(--muted); cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
.tabs button:hover { color: var(--ink); background: var(--glass-2); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
body.hack .tabs button[aria-pressed="true"] { background: #39ff14; color: #02140a; box-shadow: 0 0 14px rgba(57, 255, 20, .35); }
.notice { margin: 0; padding: var(--s2) var(--s4); border-radius: var(--r-md); background: var(--indirect-bg); border: 1px solid color-mix(in srgb, var(--indirect) 35%, transparent); color: var(--ink); font-size: .85rem; line-height: 1.6; }

/* ---- workspace ---- */
.workspace { display: grid; gap: var(--s3); grid-template-columns: minmax(0, 1fr); }
.left { display: grid; gap: var(--s2); min-width: 0; }

/* ---- the stage: HUD bands sit in their own grid rows, so they never cover the map at rest ---- */
.stage { position: relative; height: clamp(560px, 76vh, 920px); border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: var(--stage); isolation: isolate;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "sum tools" "map map" "legend hint"; gap: var(--s2) var(--s3); padding: var(--s3); }
body.hack .stage { box-shadow: 0 0 0 1px rgba(57,255,20,.18), 0 0 48px -16px rgba(57,255,20,.35); }
.stage::before { content: ""; position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; }
.stage svg { grid-area: map; position: relative; z-index: 1; width: 100%; height: 100%; min-height: 0; display: block; overflow: visible; touch-action: none; cursor: grab; }
.stage svg.grabbing { cursor: grabbing; }
.hud { position: relative; z-index: 3; margin: 0; }
.hud-sum { grid-area: sum; justify-self: start; align-self: start; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--s3); min-height: var(--h-ctl); padding: 6px var(--s3); border-radius: var(--r-md); background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); font-size: .8rem; line-height: 1.55; max-width: 100%; }
.hud-sum:empty { display: none; }
.hud-sum b { font-family: var(--display); font-size: .9rem; font-weight: 600; padding-inline-end: var(--s3); border-inline-end: 1px solid var(--line); }
.hud-sum span { white-space: nowrap; }
.hud-sum .m { color: var(--target); } .hud-sum .x { color: var(--removed); }
.hud-sum .c-high { color: var(--safe); } .hud-sum .c-medium { color: var(--direct); font-weight: 600; } .hud-sum .c-low { color: var(--removed); font-weight: 600; }
body.hack .hud-sum { display: none; }
.hud-tools { grid-area: tools; align-self: start; justify-self: end; display: flex; gap: var(--s1); padding: 3px; border-radius: calc(var(--r-md) + 3px); background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); }
.hud-tools button { width: 34px; height: 34px; border-radius: var(--r-md); border: 0; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 1.05rem; line-height: 1; }
.hud-tools button:hover { background: var(--glass-2); color: var(--accent); }
.hud-tools button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.hud-tools button.txt { width: auto; padding: 0 var(--s3); font-size: .84rem; font-weight: 600; white-space: nowrap; }
.hud-tools .theme { font-size: 1rem; }
.hud-tools button:focus-visible { outline-offset: 0; }
body.hack .hud-tools button[aria-pressed="true"] { background: #39ff14; color: #02140a; }
.hud-legend { grid-area: legend; justify-self: start; align-self: end; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); padding: 6px var(--s3); list-style: none; border-radius: var(--r-md); background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); font-size: .78rem; color: var(--muted); max-width: 100%; }
.hud-legend li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: currentColor; flex: none; }
body.hack .dot { box-shadow: 0 0 8px currentColor; }
.dot.target { color: var(--target); } .dot.removed { color: var(--removed); } .dot.direct { color: var(--direct); } .dot.indirect { color: var(--indirect); } .dot.safe { color: var(--safe); }
.hud-hint { grid-area: hint; align-self: end; justify-self: end; font-size: .78rem; color: var(--muted); background: var(--glass); border: 1px solid var(--line); padding: 6px var(--s3); border-radius: var(--r-md); backdrop-filter: blur(10px); transition: opacity .8s; pointer-events: none; white-space: nowrap; }
.hud-hint.gone { opacity: 0; }
.prompt { grid-area: sum; justify-self: start; align-self: center; color: #39ff14; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: .85rem; direction: ltr; text-align: left; text-shadow: 0 0 10px rgba(57, 255, 20, .6); white-space: nowrap; overflow: hidden; max-width: 100%; }
.prompt::after { content: "\25AE"; margin-inline-start: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .prompt::after { animation: blink 1.1s steps(2, start) infinite; } @keyframes blink { to { visibility: hidden; } }
  .stage.boot::after { content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none; background: linear-gradient(180deg, transparent 0, rgba(57, 255, 20, .45) 50%, transparent 100%); height: 38%; animation: sweep .85s ease-in forwards; }
  @keyframes sweep { from { transform: translateY(-100%); opacity: 1; } to { transform: translateY(300%); opacity: 0; } }
}
@media (max-width: 1000px) { .hud-hint { display: none; } }
@media (max-width: 700px) {
  .stage { height: clamp(560px, 78vh, 700px); grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "tools" "sum" "map" "legend"; padding: var(--s2); }
  .hud-tools { justify-self: end; }
  .hud-sum { justify-self: stretch; font-size: .76rem; }
  .hud-legend { justify-self: stretch; justify-content: center; gap: 2px var(--s3); font-size: .74rem; }
  .prompt { font-size: .76rem; }
}

/* ---- strip of parts ---- */
.strip { display: flex; gap: var(--s2); overflow-x: auto; padding: 2px 2px var(--s1); scrollbar-width: thin; }
.pick { flex: none; height: var(--h-sm); font-size: .84rem; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--pill); padding: 0 var(--s3); cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); transition: border-color .15s; }
.pick:hover { border-color: var(--line-2); }
.pick[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pick i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--safe)); flex: none; }
.pick[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--bg); }
.pick.leaf { color: var(--muted); }
.pick.leaf[aria-pressed="true"] { color: var(--bg); }
body.hack .pick i { box-shadow: 0 0 6px var(--c, var(--safe)); }

/* ---- panels ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5); display: grid; gap: var(--s4); align-content: start; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.25rem; line-height: 1.35; text-wrap: balance; }
body.hack .panel h2 { color: #39ff14; text-shadow: 0 0 10px rgba(57, 255, 20, .4); }
.panel h3 { margin: 0 0 var(--s2); font-size: .92rem; font-weight: 600; line-height: 1.5; }
.titlerow { display: flex; gap: var(--s3); align-items: flex-start; justify-content: space-between; }
.titlerow > div { flex: 1; min-width: 0; }
.sel-desc { margin: var(--s1) 0 0; color: var(--muted); font-size: .92rem; text-wrap: pretty; }
.where { margin: 2px 0 0; font-size: .78rem; color: var(--muted); direction: ltr; text-align: right; unicode-bidi: plaintext; max-height: calc(3 * 1.65em); overflow-y: auto; scrollbar-width: thin; overscroll-behavior: contain; }
.back { flex: none; height: var(--h-sm); display: inline-flex; align-items: center; justify-content: center; font-weight: 500; font-size: .82rem; padding: 0 var(--s3); border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; justify-self: start; white-space: nowrap; transition: border-color .15s, color .15s, background .15s; }
.back:hover { border-color: var(--accent); color: var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: calc(var(--r-md) + 4px); background: var(--glass-2); border: 1px solid var(--line); }
.seg button { font-weight: 600; padding: 9px 12px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--target); color: var(--on); }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* inset accent bar: a short rounded bar inside the block, never a thick border bent around a corner */
.summary, .group li, .rule, .lead, .conf.c-medium, .conf.c-low { position: relative; }
.summary::before, .group li::before, .rule::before, .lead::before, .conf.c-medium::before, .conf.c-low::before {
  content: ""; position: absolute; inset-block: 10px; inset-inline-start: 0; width: 3px; border-start-end-radius: 3px; border-end-end-radius: 3px; background: var(--bar, var(--muted)); }
.summary { margin: 0; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--glass-2); font-size: .98rem; line-height: 1.85; font-weight: 500; text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: var(--pill); font-size: .8rem; font-weight: 600; border: 1px solid; white-space: nowrap; }
.chip.removed { background: var(--removed-bg); border-color: color-mix(in srgb, var(--removed) 40%, transparent); color: var(--removed); }
.chip.target { background: var(--target-bg); border-color: color-mix(in srgb, var(--target) 40%, transparent); color: var(--target); }
.chip.direct { background: var(--direct-bg); border-color: color-mix(in srgb, var(--direct) 40%, transparent); color: var(--direct); }
.chip.indirect { background: var(--indirect-bg); border-color: color-mix(in srgb, var(--indirect) 55%, transparent); color: var(--indirect); border-style: dashed; }
.chip.safe { background: var(--safe-bg); border-color: color-mix(in srgb, var(--safe) 40%, transparent); color: var(--safe); }
.grp { display: grid; gap: var(--s4); }
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.group li { padding: 10px var(--s4); border-radius: var(--r-md); background: var(--glass-2); display: grid; gap: 2px; }
.group li b { display: block; font-weight: 600; line-height: 1.5; }
.group li .fn { font-weight: 500; }
.group li span { color: var(--muted); font-size: .84rem; line-height: 1.6; }
.group li .fn .ltr { color: var(--muted); font-size: .8rem; font-weight: 400; }
.g-removed { --bar: var(--removed); } .g-direct { --bar: var(--direct); } .g-indirect { --bar: var(--indirect); }
.g-removed h3 { color: var(--removed); } .g-direct h3 { color: var(--direct); } .g-indirect h3 { color: var(--indirect); }
.safe-line { margin: 0; color: var(--muted); font-size: .88rem; text-wrap: pretty; }
details { border: 1px solid var(--line); border-radius: var(--r-md); padding: 0 var(--s4); background: var(--surface); }
details summary { cursor: pointer; font-weight: 600; font-size: .9rem; min-height: 42px; display: flex; align-items: center; gap: var(--s2); list-style: none; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: ""; flex: none; width: 0; height: 0; border-block: 4.5px solid transparent; border-inline-start: 6px solid currentColor; opacity: .7; transition: transform .15s; }
details[open] summary::before { transform: rotate(-90deg); }
[dir="rtl"] details[open] summary::before { transform: rotate(90deg); }
details[open] { padding-bottom: var(--s4); }
details[open] summary { margin-bottom: var(--s2); }
details > br { display: block; content: ""; margin-top: var(--s3); }
summary:focus-visible { outline-offset: 4px; border-radius: var(--r-sm); }

/* ---- selection bar ---- */
.selbar { padding: var(--s4) var(--s5); gap: var(--s3); }
.selbar h2 { font-size: 1.3rem; }
#selName input { font: inherit; font-weight: 600; color: var(--ink); background: var(--glass-2); border: 1px solid var(--accent); border-radius: var(--r-sm); padding: 2px var(--s2); width: 100%; min-width: 12ch; }

/* ---- confidence ---- */
.conf { margin: 0; padding: 10px var(--s4); border-radius: var(--r-md); background: var(--glass-2); }
.conf.c-medium { --bar: var(--direct); background: color-mix(in srgb, var(--direct) 7%, var(--surface)); }
.conf.c-low { --bar: var(--removed); background: color-mix(in srgb, var(--removed) 7%, var(--surface)); }
.conf-head { margin: 0; display: flex; flex-wrap: wrap; gap: var(--s1) 10px; align-items: center; font-size: .88rem; }
.conf-tag { display: inline-flex; align-items: center; height: 24px; font-size: .8rem; font-weight: 700; padding: 0 10px; border-radius: var(--pill); background: var(--safe-bg); color: var(--safe); }
.c-medium .conf-tag { background: var(--direct-bg); color: var(--direct); } .c-low .conf-tag { background: var(--removed-bg); color: var(--removed); }
.conf ul { margin: var(--s2) 0 0; padding-inline-start: 1.25rem; display: grid; gap: 2px; font-size: .86rem; color: var(--ink); }
.conf li::marker { color: var(--muted); }

/* ---- the two result cards ---- */
.cols2 { display: grid; gap: var(--s3); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .cols2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.col { --c: var(--target); cursor: default; transition: border-color .2s, box-shadow .2s; }
.col-delete { --c: var(--removed); }
.col .summary { --bar: var(--c); }
.col.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.colhead { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: var(--h-sm); }
.colhead h3 { margin: 0; font-family: var(--display); font-size: 1.08rem; font-weight: 600; color: var(--c); display: flex; align-items: center; gap: 10px; }
.colhead h3::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.showmap[aria-pressed="true"] { background: var(--c); color: var(--on); border-color: var(--c); }
.showmap[aria-pressed="true"]:hover { color: var(--on); }
.panel, .col { min-width: 0; }

/* ---- permissions panel ---- */
.lead { --bar: var(--removed); margin: 0; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--glass-2); font-weight: 500; line-height: 1.85; text-wrap: pretty; }
.demo { margin: 0; padding: var(--s2) var(--s4); border-radius: var(--r-md); background: var(--indirect-bg); border: 1px solid color-mix(in srgb, var(--indirect) 35%, transparent); font-size: .85rem; }
.rule { padding: var(--s3) var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--glass-2); display: grid; gap: 2px; align-content: start; }
.rule b { font-weight: 600; line-height: 1.55; } .rule .worst { font-size: .88rem; } .rule .meta { color: var(--muted); font-size: .78rem; }
.rule code { direction: ltr; unicode-bidi: isolate; display: inline-block; font-size: .78rem; color: var(--muted); }
.r-red { --bar: var(--removed); } .r-yellow { --bar: var(--direct); } .r-green { --bar: var(--safe); }
.rowbtn { cursor: pointer; transition: border-color .15s, background .15s; } .rowbtn:hover { border-color: var(--line-2); }

  var typer = null;

  // ---- zoom and drag (works on whichever map is showing) ---------------------------------------------
  function curSvg() { return HACK ? $("permMap") : $("map"); }
  function vb(svg) { return svg.getAttribute("viewBox").split(" ").map(Number); }
  function setVb(svg, a) { svg.setAttribute("viewBox", a.join(" ")); }
  function resetView() { [$("map"), $("permMap")].forEach(function (s) { if (s._vb0) setVb(s, s._vb0); }); }
  function zoomBy(svg, f, cx, cy) {
    var a = vb(svg), b0 = svg._vb0 || a, nw = a[2] / f, nh = a[3] / f;
    if (nw > b0[2] * 1.6 || nw < b0[2] / 5) return;
    var px = cx == null ? a[0] + a[2] / 2 : cx, py = cy == null ? a[1] + a[3] / 2 : cy;
    setVb(svg, [px - (px - a[0]) / f, py - (py - a[1]) / f, nw, nh]);
  }
  function toUser(svg, ev) { var r = svg.getBoundingClientRect(), a = vb(svg), s = Math.min(r.width / a[2], r.height / a[3]), ox = (r.width - a[2] * s) / 2, oy = (r.height - a[3] * s) / 2; return { x: a[0] + (ev.clientX - r.left - ox) / s, y: a[1] + (ev.clientY - r.top - oy) / s, s: s }; }
  [$("map"), $("permMap")].forEach(function (svg) {
    var drag = null, moved = false;
    svg.addEventListener("wheel", function (e) { e.preventDefault(); var u = toUser(svg, e); zoomBy(svg, Math.exp(-e.deltaY * .0015), u.x, u.y); $("hint").classList.add("gone"); }, { passive: false });
    svg.addEventListener("pointerdown", function (e) { if (e.button > 0) return; drag = { x: e.clientX, y: e.clientY, vb: vb(svg), s: toUser(svg, e).s }; moved = false; });
    window.addEventListener("pointermove", function (e) {
      if (!drag || drag.svg === false) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      if (!moved) { moved = true; svg.classList.add("grabbing"); $("hint").classList.add("gone"); }
      var a = drag.vb; setVb(svg, [a[0] - dx / drag.s, a[1] - dy / drag.s, a[2], a[3]]);
    });
    window.addEventListener("pointerup", function () { if (drag) { drag = null; svg.classList.remove("grabbing"); } });
    svg.addEventListener("click", function (e) { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  });
  function zoomTo(id) {
    var svg = $("map"), p = pos[id], b0 = svg._vb0; if (!p || !b0) return;
    var w = Math.max(520, b0[2] / 4), h = w * b0[3] / b0[2], a = vb(svg);
    if (a[2] <= w * 1.05) { setVb(svg, [a[0] + (p.x - (a[0] + a[2] / 2)), a[1] + (p.y - (a[1] + a[3] / 2)), a[2], a[3]]); return; }
    setVb(svg, [p.x - w / 2, p.y - h / 2, w, h]);
  }
  $("bFull").addEventListener("click", function () {
    FULL = !FULL; this.setAttribute("aria-pressed", String(FULL)); this.textContent = FULL ? T("ملخّص", "Summary") : T("كل التفاصيل", "All details");

  });

  }
